<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Product Card Grid</title>
  <link rel="stylesheet" href="product.css">
</head>

<body>
  <header>
    <h1>Shop Products</h1>
  </header>

  <article class="product-card">
    <div class="product-card">
      <div class="product-image">
        <img src="https://m.media-amazon.com/images/I/71TA78cJRwL._SX679_.jpg" alt="Product 1">
      </div>
      <h2>Product 1</h2>
      <span>$19.99</span>
      <button class="btn">Buy Now</button>
  </article>
  <article class="product-card">
    <div class="product-image">
      <img src="https://m.media-amazon.com/images/I/913irsXY8nL._SX679_.jpg" alt="Product 2">
    </div>
    <h2>Product 2</h2>
    <span>$29.99</span>
    <button class="btn">Buy Now</button>
  </article>

  <article class="product-card">
    <div class="product-image">
      <img src="https://m.media-amazon.com/images/I/51M+J+TR70L._SX679_.jpg" alt="Product 3">
    </div>
    <h2>Product 3</h2>
    <span>$39.99</span>
    <button class="btn">Buy Now</button>
  </article>

</body>

</html>
